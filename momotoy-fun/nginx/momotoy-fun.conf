# =============================================================================
# momotoy.fun 双域 nginx 配置
# -----------------------------------------------------------------------------
# 部署位置: /etc/nginx/sites-available/momotoy-fun.conf → symlink → sites-enabled/
# 源服: 47.98.103.151
# 创建: 2026-07-28 (Plan C 着陆页)
# 对应源码: soa/momotoy-fun/
#
# ⚠️  备案期: server_name _;   (IP 直访也能命中)
# ✅  备案后: 取消备案期注释, 用真实 server_name (跟 certbot 一起切)
# =============================================================================

# -----------------------------------------------------------------------------
# 1) HTTP 80: 全域 301 → HTTPS (生产期), 备案期保持 80 直通
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;

    # 备案期: 任意 host 命中, 第一优先级是 momotoy.fun
    server_name _;

    # 备案后: 替换为 ↓↓↓ (3 行)
    # server_name www.momotoy.fun dw.momotoy.fun;

    # 备案期策略: 不强制 https, 让 80 直通着陆页 (跟 momotoys.tech 一致)
    # 备案后: 取消下面这行 if, 启用 443 server block
    # if ($scheme != "https") { return 301 https://$host$request_uri; }

    root /var/www/momotoy-fun/www;
    index index.html;

    # 健康检查 endpoint (PM2 / 监控用)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # dw 子路径: /dw/* → /var/www/momotoy-fun/dw/* (备案期占位页)
    # 备案后 + server_name 真实值后, dw.momotoy.fun 走独立 server block, 这个 alias block 可移除
    location /dw/ {
        alias /var/www/momotoy-fun/dw/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # SPA fallback (Phase 2 升 React 才有意义, 现在是纯 HTML)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

